# Managed deployment blueprint. Supply secrets and a real frontend HTTPS origin before launch.
services:
  - type: keyvalue
    name: trust-redis
    region: frankfurt
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
  - type: pserv
    name: trust-api
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    preDeployCommand: python -m scripts.migrate_production
    maxShutdownDelaySeconds: 30
    disk:
      name: trust-private-history
      mountPath: /var/lib/trust
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: trust-redis
          property: connectionString
      - key: CREDENTIAL_SIGNING_SECRET
        generateValue: true
      - key: INTERNAL_PROXY_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: disabled
      - key: HISTORY_AUDIO_DIR
        value: /var/lib/trust/history
      - key: RUN_HISTORY_WORKER
        value: "true"
      - key: HISTORY_AI_ENABLED
        value: "false"
      - key: HISTORY_SPEECH_ENABLED
        value: "false"
  - type: web
    name: trust-web
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api/v1
      - key: API_PROXY_HOSTPORT
        fromService:
          type: pserv
          name: trust-api
          property: hostport
      - key: INTERNAL_PROXY_SECRET
        fromService:
          type: pserv
          name: trust-api
          envVarKey: INTERNAL_PROXY_SECRET
      - key: PROXY_TRUSTED_HOPS
        value: "0"
