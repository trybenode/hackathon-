name: CI

# Local runs use SQLite for speed. This is where the Postgres run becomes
# mandatory: the suite runs against the same engine as Neon, after the
# migrations have actually been applied, so nothing merges without catching
# Postgres-specific problems (enum labels, timezone-aware timestamps, types).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (Postgres)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trust
          POSTGRES_PASSWORD: trust
          POSTGRES_DB: trust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://trust:trust@localhost:5432/trust_test
      TEST_DATABASE_URL: postgresql+asyncpg://trust:trust@localhost:5432/trust_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check upgrades from both previous heads
        working-directory: backend
        run: python scripts/check_migration_paths.py

      - name: Apply migrations
        working-directory: backend
        # Proves the migrations build the schema from scratch, which a local
        # SQLite run never exercises.
        run: alembic upgrade head

      - name: Check migrations match the models
        working-directory: backend
        # Applying migrations proves they run; this proves they produce the
        # schema the models describe.
        run: python scripts/check_migrations.py

      - name: Run tests against Postgres
        working-directory: backend
        run: pytest -q

      - name: Audit runtime dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements-runtime.txt

      - name: Check OpenAPI snapshot
        run: |
          cd backend
          python scripts/export_openapi.py
          git diff --exit-code -- ../docs/openapi.json

      - name: Check production supervisor
        working-directory: backend
        run: python ../scripts/check_production_runtime.py --database-url "$DATABASE_URL"

      - name: Check serverless profile
        working-directory: backend
        run: python ../scripts/check_production_runtime.py --serverless --database-url "$DATABASE_URL"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Takes the version from "packageManager" in frontend/package.json, so
      # the root package.json (which Vercel and Neon tooling use) can't break it.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Type check
        working-directory: frontend
        run: pnpm typecheck

      - name: Lint
        working-directory: frontend
        run: pnpm lint

      - name: Audit production dependencies
        working-directory: frontend
        run: pnpm audit --prod

      - name: Check language dictionaries
        working-directory: frontend
        run: pnpm test:language

      - name: Build production frontend
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: /api/v1
        run: pnpm build

      - name: Check production API proxy
        run: node scripts/check_proxy_smoke.mjs

  containers:
    name: Production images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t trust-api:ci .
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t trust-web:ci .
